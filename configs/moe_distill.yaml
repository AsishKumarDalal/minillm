# MoE logit distillation from a pretrained HuggingFace teacher.
#
# Student  = configs/moe_config.yaml, loaded from moe/moe_model_latest.pt or
#            a previous moe/moe_model_distill.pt.
# Teacher  = pretrained GPT-2-family LM (default gpt2-xl) with the same
#            GPT-2 BPE vocabulary (50257 tokens).
# Loss     = (1 - alpha) * CE + alpha * KL(teacher || student) * T^2
#            + the student's MoE load-balancing auxiliary loss.
#
# Usage:
#   python -m distill.moe_distill
#   python -m distill.moe_distill --teacher openai-community/gpt2 --alpha 0.4
#   python -m distill.moe_distill --new
#   python -m distill.moe_distill --fullnew
#
# Local artifacts:
#   moe_distill_checkpoints/moe_model_distill.pt
#   moe_distill_outs/metrics.json + loss/CE/KL/perplexity/validation plots
# HF artifacts:
#   moe/moe_model_distill.pt
#   moe/distill_outs/...

seed: 1337
device: auto
num_gpus: 2

teacher:
  name: openai-community/gpt2-xl
  device: null
  dtype: auto
  context_length: null
  token_env: HF_TOKEN

student:
  source: hf
  repo_id: sddfhy546y/minillm
  filename: moe/moe_model_latest.pt
  local_path: moe_checkpoints/moe_model_latest.pt
  prefer_local: true
  token_env: HF_TOKEN

model_config: configs/moe_config.yaml

alpha: 0.3
temperature: 1.0

amp: true
amp_dtype: auto
learning_rate: 1.0e-4
min_lr: 1.0e-5
warmup_steps: 100
weight_decay: 0.01
betas: [0.9, 0.95]
grad_clip: 1.0

batch_size: 4
grad_accum_steps: 1
max_steps: null
max_hours: null
token_budget: null

log_first_steps: 10
log_interval: 100
sample_interval: 1000
sample_prompt: "Albert Einstein is a"
sample_max_new_tokens: 60
sample_temperature: 0.8
sample_top_k: 50

checkpoint_interval_minutes: 60
checkpoint_dir: moe_distill_checkpoints
out_dir: moe_distill_outs
save_optimizer: false
progress: true

data:
  dataset_name: Skylion007/openwebtext
  split: train
  block_size: null
  shuffle_buffer: 1000
  max_docs: null
  min_chars: 1
  val_docs: 64
  val_batches: 4
  val_batch_size: 4

hf:
  enabled: true
  repo_id: sddfhy546y/minillm
  token_env: HF_TOKEN
  filename: moe_model_distill.pt
  path_in_repo: moe/moe_model_distill.pt
  out_dir: moe/distill_outs
  private: true
  upload_retries: 3
  upload_retry_backoff: 2.0
