# Pretraining configuration for configs/model.yaml
#
# HF artifacts (when enabled), mirroring the MoE layout under moe/:
#   dense/minillm_latest.pt
#   dense/out/...
#
# Hardware:
#   device: auto  -> use min(num_gpus, available GPUs), else CPU
#   device: cpu   -> force CPU
#   device: cuda  -> use up to num_gpus GPUs
#   device: cuda:1 -> force one specific GPU

seed: 1337
device: auto
num_gpus: 2
amp: true
amp_dtype: auto        # auto | bf16 | fp16 | fp32

batch_size: 8
grad_accum_steps: 1
max_steps: null        # null = train until interrupted / time limit / data exhausted
max_hours: null        # e.g. 6 or 12; stop after N wall-clock hours and upload
token_budget: null     # e.g. 15000000; stop after N tokens (--budget overrides)

# Estimated GPT-2 BPE tokens in one full pass of Skylion007/openwebtext.
# Used only as the progress-bar denominator when no --hours/--budget is given.
# Source: HF dataset metadata reports 39,769,491,688 text bytes over
# 8,013,769 documents (huggingface.co/api/datasets/Skylion007/openwebtext).
# Sampling 500 documents with tiktoken's "gpt2" encoder gave 4.4325 bytes/token,
# so 39,769,491,688 / 4.4325 ~= 8.97B tokens.
estimated_total_tokens: 8972315576
learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 200
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
log_first_steps: 10    # log every step for the first N steps
log_interval: 100      # after that, record a metrics point every N steps

# Every sample_interval steps, generate a short continuation of sample_prompt
# and write it to the log so you can eyeball whether the model is improving.
# Set sample_interval: 0 to disable.
sample_interval: 1000
sample_prompt: "Albert Einstein is a"
sample_max_new_tokens: 60
sample_temperature: 0.8
sample_top_k: 50

checkpoint_interval_minutes: 60
checkpoint_dir: checkpoints
out_dir: out            # local metrics + plots; uploaded to HF under dense/out/
save_optimizer: true    # false = smaller checkpoints, optimizer starts fresh
progress: true          # tqdm.auto bar; % of max_steps, max_hours, or next save

data:
  dataset_name: Skylion007/openwebtext
  split: train
  block_size: null     # null -> model context_length
  shuffle_buffer: 1000
  max_docs: null
  min_chars: 1

hf:
  repo_id: "sddfhy546y/minillm"  # e.g. "your-username/minillm"
  token_env: HF_TOKEN  # read from .env or the environment
  filename: minillm_latest.pt            # local checkpoint filename
  path_in_repo: dense/minillm_latest.pt  # checkpoint path inside the HF repo
  out_dir: dense/out                     # plots/metrics path inside the HF repo
  private: true
  upload_retries: 3    # retries per upload on transient Hub/network errors
  upload_retry_backoff: 2.0  # seconds before the first retry, then doubled
